services:
  - type: web
    name: floodsense-malaysia
    runtime: python
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FLASK_DEBUG
        value: "0"
